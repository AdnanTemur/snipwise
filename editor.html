<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Snipwise Editor</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* Light theme (default) — plain, neutral, high-contrast, mini-Photoshop-ish */
      --bg: #e7e9ec;
      --surface: #ffffff;
      --surface2: #f1f2f4;
      --surface3: #e4e6e9;
      --border: #d3d5da;
      --border-strong: #aeb1b8;
      --accent: #6d4aff;
      --accent-hover: #5b39f0;
      --accent-soft: #efeaff;
      --text: #15171c;
      --text-muted: #676b74;
      --danger: #dc2626;
      --shadow: rgba(20, 20, 30, 0.1);
      --sans:
        "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
      --mono:
        "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code",
        "Consolas", monospace;
    }

    html.dark {
      --bg: #18191c;
      --surface: #232427;
      --surface2: #2b2c30;
      --surface3: #35363b;
      --border: #3a3b40;
      --border-strong: #55575f;
      --accent: #9583ff;
      --accent-hover: #a99aff;
      --accent-soft: #332c5c;
      --text: #f2f2f4;
      --text-muted: #9a9ca5;
      --danger: #f87171;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      transition:
        background 0.2s,
        color 0.2s;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--shadow);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .tb-brand {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-right: 8px;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    .tb-brand span {
      color: var(--accent);
    }

    .tb-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .tool {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.12s;
      flex-shrink: 0;
      position: relative;
    }

    .tool:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 1px 4px var(--shadow);
    }

    .tool.toggle-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool svg {
      width: 17px;
      height: 17px;
    }

    .btn-icon {
      display: inline-flex;
      width: 15px;
      height: 15px;
    }

    .btn-icon svg {
      width: 100%;
      height: 100%;
    }

    .tool[title]:hover::after {
      content: attr(title);
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      white-space: nowrap;
      font-family: var(--sans);
      pointer-events: none;
      z-index: 100;
    }

    /* Color picker row */
    .colors {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      padding: 2px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--surface2);
      box-shadow: 0 0 0 1px var(--border-strong);
      transition:
        box-shadow 0.15s,
        transform 0.15s;
      flex-shrink: 0;
    }

    .color-swatch:hover {
      transform: scale(1.15);
    }

    .color-swatch.active {
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.1);
    }

    /* Free color picker — a rainbow ring makes it unmistakable as "pick any
       color", rather than blending in as an 8th solid preset swatch. */
    .color-custom-wrap {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      padding: 2px;
      background: conic-gradient(from 0deg, #ff3b30, #ffcc00, #34c759, #00c7be, #007aff, #af52de, #ff3b30);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-custom {
      width: 100%;
      height: 100%;
      padding: 0;
      border: 2px solid var(--surface2);
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .color-custom::-webkit-color-swatch-wrapper {
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    .color-custom::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }

    .color-custom::-moz-color-swatch {
      border: none;
      border-radius: 50%;
    }

    /* Stroke size */
    .stroke-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .stroke-label {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .stroke-input {
      width: 42px;
      height: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      font-family: var(--mono);
      text-align: center;
      padding: 0 4px;
    }

    .hex-input {
      width: 66px;
      height: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 11px;
      font-family: var(--mono);
      text-align: center;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .hex-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Right side actions */
    .tb-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      height: 32px;
      padding: 0 14px;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      transition: all 0.12s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
    }

    .btn-ghost:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Theme toggle */
    .tbtn {
      width: 34px;
      height: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .tthumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      position: absolute;
      top: 2px;
      left: 2px;
      transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    html.dark .tthumb {
      transform: translateX(14px);
    }

    /* ── Sidebar (Pages + Layers, stacked) ── */
    .sidebar {
      width: 224px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .panel-section {
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid var(--border);
      max-height: 42%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-section.panel-grow {
      flex: 1;
      max-height: none;
      border-bottom: none;
      min-height: 0;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 12px 8px;
      flex-shrink: 0;
      background: var(--surface);
    }

    .panel-header-icon {
      width: 13px;
      height: 13px;
      display: inline-flex;
      color: var(--accent);
      flex-shrink: 0;
    }

    .panel-header-icon svg {
      width: 100%;
      height: 100%;
    }

    .panel-count {
      margin-left: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0;
      text-transform: none;
    }

    .panel-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 8px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }

    .panel-empty {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--mono);
      padding: 12px 4px;
      text-align: center;
    }

    /* ── Layers panel: two-tier row (thumb+name+visibility, then
       opacity+reorder+delete) — keeps each line uncrowded ── */
    .layer-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 7px 8px 7px 9px;
      border-radius: 8px;
      border: 1px solid transparent;
      border-left-width: 3px;
      cursor: pointer;
      background: var(--surface);
      transition:
        background 0.12s,
        border-color 0.12s,
        box-shadow 0.12s;
    }

    .layer-row:hover {
      background: var(--surface2);
      border-color: var(--border);
      box-shadow: 0 1px 3px var(--shadow);
    }

    .layer-row.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .layer-row.active .row-name {
      color: var(--accent);
      font-weight: 700;
    }

    .layer-row-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-row-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 44px;
    }

    .row-thumb {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px var(--shadow);
      flex-shrink: 0;
    }

    .row-name {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .row-opacity {
      flex: 1;
      min-width: 0;
    }

    /* ── Pages panel: vertical cards — big preview thumbnail on top,
       slim footer for name + reorder ── */
    .page-card {
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      transition:
        border-color 0.12s,
        box-shadow 0.12s;
    }

    .page-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 2px 6px var(--shadow);
    }

    .page-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .page-card.active .row-name {
      color: var(--accent);
      font-weight: 700;
    }

    .page-card-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: var(--bg);
      overflow: hidden;
    }

    .page-card-thumb canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .page-card-del {
      position: absolute;
      top: 5px;
      right: 5px;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition:
        opacity 0.12s,
        background 0.12s,
        color 0.12s;
    }

    .page-card:hover .page-card-del {
      opacity: 1;
    }

    .page-card-del:hover {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .page-card-del svg {
      width: 13px;
      height: 13px;
    }

    .page-card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-top: 1px solid var(--border);
    }

    .row-btn {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 10px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .row-btn:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .row-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .row-btn-danger:hover {
      background: var(--danger);
      color: #fff;
    }

    .row-btn svg {
      width: 13px;
      height: 13px;
    }

    .panel-add-btn {
      margin: 4px 2px 2px;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px dashed var(--border-strong);
      color: var(--accent);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--sans);
      flex-shrink: 0;
    }

    .panel-add-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    /* ── Editor body (sidebar + canvas) ── */
    .editor-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Canvas area ── */
    .canvas-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      position: relative;
    }

    .canvas-wrap.drag-over::after {
      content: "Drop images to add as layers";
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      pointer-events: none;
      z-index: 900;
    }

    .canvas-container {
      position: relative;
      box-shadow: 0 8px 30px var(--shadow);
      line-height: 0;
      max-width: 100%;
      min-width: 0;
      background: #fff;
    }

    #displayCanvas {
      display: block;
      height: auto;
    }

    #annotationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* First-run / empty-page onboarding placeholder */
    .canvas-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 480px;
      min-height: 280px;
      margin: auto;
      border: 2px dashed var(--border-strong);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }

    .canvas-wrap.is-empty .canvas-empty {
      display: flex;
    }

    .canvas-wrap.is-empty .canvas-container {
      display: none;
    }

    .canvas-empty-icon {
      width: 40px;
      height: 40px;
      color: var(--text-muted);
    }

    .canvas-empty-icon svg {
      width: 100%;
      height: 100%;
    }

    .canvas-empty-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .canvas-empty-desc {
      font-size: 12px;
      max-width: 320px;
      line-height: 1.55;
    }

    .canvas-empty-desc strong {
      color: var(--accent);
    }

    .canvas-empty-btn {
      margin-top: 6px;
      padding: 8px 16px;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      font-family: var(--sans);
      box-shadow: 0 1px 4px var(--shadow);
    }

    .canvas-empty-btn:hover {
      background: var(--accent-hover);
    }

    /* ── Modal (PDF export settings/preview) ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 16, 20, 0.55);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal {
      width: min(880px, 100%);
      height: min(640px, 90vh);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 60px var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      flex-shrink: 0;
    }

    .modal-close {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
    }

    .modal-close:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
    }

    .modal-body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .pdf-settings {
      width: 240px;
      flex-shrink: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    .pdf-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .pdf-field select,
    .pdf-field input[type="text"],
    .pdf-field input[type="number"] {
      height: 30px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: var(--sans);
      padding: 0 8px;
    }

    .pdf-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }

    #pdfCoverFields {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 10px;
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .pdf-accent-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pdf-accent-swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pdf-accent-custom-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pdf-accent-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 0 1px var(--border-strong);
    }

    .pdf-accent-swatch.active {
      box-shadow: 0 0 0 2px var(--accent);
    }

    .pdf-preview {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      min-width: 0;
      min-height: 400px;
    }

    #pdfPreviewFrame {
      flex: 1;
      width: 100%;
      min-height: 360px;
      border: none;
      background: #fff;
    }

    .pdf-preview-status {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      font-family: var(--mono);
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 8px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Status bar ── */
    .statusbar {
      padding: 5px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .status-text {
      font-size: 10px;
      color: var(--text-muted);
      font-family: var(--mono);
    }

    .statusbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px;
    }

    .zoom-btn {
      width: 20px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--mono);
      border-radius: 4px;
    }

    .zoom-btn:hover {
      background: var(--surface3);
      color: var(--text);
    }

    .zoom-fit {
      width: auto;
      padding: 0 6px;
      font-size: 9px;
      font-weight: 700;
    }

    .zoom-level {
      min-width: 40px;
      height: 18px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 10px;
      font-family: var(--mono);
      font-weight: 700;
      border-radius: 4px;
    }

    .zoom-level:hover {
      background: var(--surface3);
    }

    /* Loading screen */
    .loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 1000;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 13px;
      color: var(--text-muted);
      font-family: var(--mono);
    }
  </style>
</head>

<body>
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading capture…</div>
  </div>

  <div class="toolbar" id="toolbar" style="display: none">
    <div class="tb-brand">Snip<span>wise</span></div>
    <div class="tb-sep"></div>

    <!-- Tools -->
    <button class="tool" id="toolMove" title="Move / Select (V)" data-icon="move"></button>
    <button class="tool" id="toolRatioLock" title="Lock aspect ratio when resizing" data-icon="ratioUnlock"></button>
    <div class="tb-sep"></div>
    <button class="tool active" id="toolPen" title="Pen (P)" data-icon="pen"></button>
    <button class="tool" id="toolArrow" title="Arrow (A)" data-icon="arrow"></button>
    <button class="tool" id="toolLine" title="Line (L)" data-icon="line"></button>
    <button class="tool" id="toolRect" title="Rectangle (R)" data-icon="rect"></button>
    <button class="tool" id="toolCircle" title="Circle (C)" data-icon="circle"></button>
    <button class="tool" id="toolText" title="Text (T)">T</button>
    <button class="tool" id="toolHighlight" title="Highlight (H)" data-icon="highlight"></button>
    <button class="tool" id="toolBlur" title="Blur / Redact (B)" data-icon="blur"></button>
    <button class="tool" id="toolStep" title="Step Marker (S)" data-icon="step"></button>
    <button class="tool" id="toolCallout" title="Callout Bubble (O)" data-icon="callout"></button>
    <button class="tool" id="toolEmoji" title="Emoji Stamp (E)" data-icon="emoji"></button>
    <button class="tool" id="toolCropCanvas" title="Crop Canvas (X)" data-icon="crop"></button>

    <div class="tb-sep"></div>

    <!-- Colors -->
    <div class="colors" id="colorPicker">
      <div class="color-swatch active" style="background: #a78bfa" data-color="#a78bfa"></div>
      <div class="color-swatch" style="background: #f87171" data-color="#f87171"></div>
      <div class="color-swatch" style="background: #4ade80" data-color="#4ade80"></div>
      <div class="color-swatch" style="background: #fbbf24" data-color="#fbbf24"></div>
      <div class="color-swatch" style="background: #38bdf8" data-color="#38bdf8"></div>
      <div class="color-swatch" style="background: #ffffff" data-color="#ffffff"></div>
      <div class="color-swatch" style="background: #000000" data-color="#000000"></div>
      <div class="tb-sep"></div>
      <label class="color-custom-wrap" title="Custom color — pick any color">
        <input type="color" class="color-custom" id="customColor" value="#a78bfa" />
      </label>
    </div>

    <input
      class="hex-input"
      id="hexColor"
      type="text"
      value="#a78bfa"
      maxlength="7"
      spellcheck="false"
      autocomplete="off"
      title="Hex color"
    />

    <div class="tb-sep"></div>

    <!-- Stroke size -->
    <div class="stroke-wrap">
      <span class="stroke-label">px</span>
      <input class="stroke-input" id="strokeSize" type="number" min="1" max="40" value="3" />
    </div>

    <div class="tb-sep"></div>

    <button class="tool" id="toolUndo" title="Undo" data-icon="undo"></button>
    <button class="tool" id="toolClear" title="Clear all annotations" data-icon="clear"></button>

    <div class="tb-right">
      <button class="tbtn" id="themeBtn" title="Toggle light / dark theme">
        <div class="tthumb" id="themeThumb"></div>
      </button>
      <button class="btn btn-ghost" id="btnAddImage"><span class="btn-icon" data-icon="addImage"></span> Add Image</button>
      <button class="btn btn-ghost" id="btnCopy"><span class="btn-icon" data-icon="copy"></span> Copy Image</button>
      <button class="btn btn-ghost" id="btnExportPdf"><span class="btn-icon" data-icon="exportPdf"></span> Export PDF</button>
      <button class="btn btn-primary" id="btnDownload"><span class="btn-icon" data-icon="download"></span> Download PNG</button>
    </div>
  </div>

  <!-- Emoji picker panel -->
  <div id="emojiPanel" style="
        display: none;
        position: fixed;
        z-index: 9999;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        grid-template-columns: repeat(8, 32px);
        gap: 4px;
        box-shadow: 0 8px 24px var(--shadow);
      "></div>

  <!-- PDF export settings/preview dialog — populated by ui/pdf-export-dialog.js -->
  <div id="pdfDialogOverlay" class="modal-overlay"></div>

  <div class="editor-body">
    <div class="sidebar">
      <div class="panel-section" id="pagesSection">
        <div class="panel-header">
          <span class="panel-header-icon" data-icon="pagesIcon"></span>
          <span>Pages</span>
          <span class="panel-count" id="pagesCount">0</span>
        </div>
        <div class="panel-list" id="pagesPanel"></div>
      </div>
      <div class="panel-section panel-grow" id="layersSection">
        <div class="panel-header">
          <span class="panel-header-icon" data-icon="layersIcon"></span>
          <span>Layers</span>
          <span class="panel-count" id="layersCount">0</span>
        </div>
        <div class="panel-list" id="layersPanel"></div>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap" style="display: none">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="displayCanvas"></canvas>
        <canvas id="annotationCanvas"></canvas>
      </div>
      <div class="canvas-empty" id="canvasEmptyState">
        <div class="canvas-empty-icon" data-icon="imagePlaceholder"></div>
        <div class="canvas-empty-title">This page is empty</div>
        <div class="canvas-empty-desc">
          Drag an image here, paste with <strong>Ctrl+V</strong>, or click
          <strong>Add Image</strong> in the toolbar to get started.
        </div>
        <button class="canvas-empty-btn" id="btnAddImageEmpty">
          <span class="btn-icon" data-icon="addImage"></span> Add Image
        </button>
      </div>
    </div>
  </div>

  <div class="statusbar" id="statusbar" style="display: none">
    <span class="status-text" id="statusText">Ready</span>
    <div class="statusbar-right">
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoomOutBtn" title="Zoom out">−</button>
        <button class="zoom-level" id="zoomLevelBtn" title="Reset to 100%">100%</button>
        <button class="zoom-btn" id="zoomInBtn" title="Zoom in">+</button>
        <button class="zoom-btn zoom-fit" id="zoomFitBtn" title="Fit to window">Fit</button>
      </div>
      <span class="status-text" id="sizeText"></span>
    </div>
  </div>

  <script src="jspdf.min.js"></script>
  <script type="module" src="editor/main.js"></script>
</body>

</html>
