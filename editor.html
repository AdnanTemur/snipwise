<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snipwise Editor</title>
    <style>
      /* Fonts loaded via system stack */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0a080f;
        --surface: #16121f;
        --surface2: #1e1829;
        --border: #2d2540;
        --border-hi: #4c3d6e;
        --accent: #a78bfa;
        --accent2: #7c3aed;
        --accent3: #c4b5fd;
        --text: #f5f3ff;
        --muted: rgba(196, 181, 253, 0.5);
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        --mono:
          "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code",
          "Consolas", monospace;
      }
      html.light {
        --bg: #faf8ff;
        --surface: #f3f0ff;
        --surface2: #ede9fe;
        --border: #ddd6fe;
        --border-hi: #a78bfa;
        --accent: #7c3aed;
        --accent2: #6d28d9;
        --accent3: #8b5cf6;
        --text: #1e1b4b;
        --muted: rgba(109, 40, 217, 0.5);
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        transition:
          background 0.2s,
          color 0.2s;
      }

      /* ── Toolbar ── */
      .toolbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .tb-brand {
        font-size: 14px;
        font-weight: 700;
        color: var(--text);
        margin-right: 8px;
        letter-spacing: -0.3px;
        white-space: nowrap;
      }
      .tb-brand span {
        color: var(--accent);
      }

      .tb-sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
        flex-shrink: 0;
      }

      .tool {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        background: transparent;
        border: 1px solid transparent;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        transition: all 0.15s;
        flex-shrink: 0;
        position: relative;
      }
      .tool:hover {
        background: var(--surface2);
        border-color: var(--border);
        color: var(--text);
      }
      .tool.active {
        background: var(--accent2);
        border-color: var(--accent2);
        color: #fff;
      }
      .tool[title]:hover::after {
        content: attr(title);
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--surface2);
        color: var(--text);
        font-size: 10px;
        padding: 3px 7px;
        border-radius: 4px;
        border: 1px solid var(--border);
        white-space: nowrap;
        font-family: var(--sans);
        pointer-events: none;
        z-index: 100;
      }

      /* Color picker row */
      .colors {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .color-swatch {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
        transition:
          border-color 0.15s,
          transform 0.15s;
        flex-shrink: 0;
      }
      .color-swatch:hover {
        transform: scale(1.15);
      }
      .color-swatch.active {
        border-color: #fff;
        transform: scale(1.1);
      }

      /* Stroke size */
      .stroke-wrap {
        display: flex;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }
      .stroke-label {
        font-size: 10px;
        color: var(--muted);
        font-family: var(--mono);
      }
      .stroke-input {
        width: 42px;
        height: 24px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        font-size: 11px;
        font-family: var(--mono);
        text-align: center;
        padding: 0 4px;
      }

      /* Right side actions */
      .tb-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      .btn {
        height: 32px;
        padding: 0 14px;
        border-radius: 6px;
        font-family: var(--sans);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border);
        transition: all 0.15s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
      }
      .btn-ghost:hover {
        background: var(--surface2);
        color: var(--text);
        border-color: var(--border-hi);
      }
      .btn-primary {
        background: var(--accent2);
        color: #fff;
        border-color: var(--accent2);
      }
      .btn-primary:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
      .btn-outline {
        background: transparent;
        color: var(--accent);
        border-color: var(--accent);
      }
      .btn-outline:hover {
        background: var(--accent2);
        color: #fff;
        border-color: var(--accent2);
      }

      /* Theme toggle */
      .tbtn {
        width: 32px;
        height: 18px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 9px;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
      }
      .tthumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        position: absolute;
        top: 2px;
        left: 2px;
        transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      html.light .tthumb {
        transform: translateX(14px);
      }

      /* ── Canvas area ── */
      .canvas-wrap {
        flex: 1;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
      }

      .canvas-container {
        position: relative;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        line-height: 0;
      }

      #baseCanvas {
        display: block;
      }
      #drawCanvas {
        position: absolute;
        top: 0;
        left: 0;
        cursor: crosshair;
      }

      /* ── Status bar ── */
      .statusbar {
        padding: 5px 14px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      .status-text {
        font-size: 10px;
        color: var(--muted);
        font-family: var(--mono);
      }

      /* Loading screen */
      .loading {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 1000;
      }
      .loading-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-text {
        font-size: 13px;
        color: var(--muted);
        font-family: var(--mono);
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading capture…</div>
    </div>

    <div class="toolbar" id="toolbar" style="display: none">
      <div class="tb-brand">Snip<span>wise</span></div>
      <div class="tb-sep"></div>

      <!-- Tools -->
      <button class="tool active" id="toolPen" title="Pen (P)">✏️</button>
      <button class="tool" id="toolArrow" title="Arrow (A)">↗</button>
      <button class="tool" id="toolLine" title="Line (L)">╱</button>
      <button class="tool" id="toolRect" title="Rectangle (R)">▭</button>
      <button class="tool" id="toolCircle" title="Circle (C)">○</button>
      <button class="tool" id="toolText" title="Text (T)">T</button>
      <button class="tool" id="toolHighlight" title="Highlight (H)">🖍</button>
      <button class="tool" id="toolBlur" title="Blur / Redact (B)">⬛</button>
      <button class="tool" id="toolStep" title="Step Marker (S)">①</button>
      <button class="tool" id="toolCallout" title="Callout Bubble (O)">
        💬
      </button>
      <button class="tool" id="toolEmoji" title="Emoji Stamp (E)">😀</button>
      <button class="tool" id="toolCropCanvas" title="Crop Canvas (X)">
        ✂
      </button>

      <div class="tb-sep"></div>

      <!-- Colors -->
      <div class="colors" id="colorPicker">
        <div
          class="color-swatch active"
          style="background: #a78bfa"
          data-color="#a78bfa"
        ></div>
        <div
          class="color-swatch"
          style="background: #f87171"
          data-color="#f87171"
        ></div>
        <div
          class="color-swatch"
          style="background: #4ade80"
          data-color="#4ade80"
        ></div>
        <div
          class="color-swatch"
          style="background: #fbbf24"
          data-color="#fbbf24"
        ></div>
        <div
          class="color-swatch"
          style="background: #38bdf8"
          data-color="#38bdf8"
        ></div>
        <div
          class="color-swatch"
          style="background: #ffffff"
          data-color="#ffffff"
        ></div>
        <div
          class="color-swatch"
          style="background: #000000"
          data-color="#000000"
        ></div>
      </div>

      <div class="tb-sep"></div>

      <!-- Stroke size -->
      <div class="stroke-wrap">
        <span class="stroke-label">px</span>
        <input
          class="stroke-input"
          id="strokeSize"
          type="number"
          min="1"
          max="40"
          value="3"
        />
      </div>

      <div class="tb-sep"></div>

      <button class="tool" id="toolUndo" title="Undo">↩</button>
      <button class="tool" id="toolClear" title="Clear all annotations">
        🗑
      </button>

      <div class="tb-right">
        <button class="tbtn" id="themeBtn">
          <div class="tthumb" id="themeThumb"></div>
        </button>
        <button class="btn btn-ghost" id="btnCopy">📋 Copy Image</button>
        <button class="btn btn-primary" id="btnDownload">⬇ Download PNG</button>
      </div>
    </div>

    <!-- Emoji picker panel -->
    <div
      id="emojiPanel"
      style="
        display: none;
        position: fixed;
        z-index: 9999;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        grid-template-columns: repeat(8, 32px);
        gap: 4px;
        box-shadow: 0 8px 24px var(--shadow);
      "
    ></div>

    <div class="canvas-wrap" id="canvasWrap" style="display: none">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="baseCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>

    <div class="statusbar" id="statusbar" style="display: none">
      <span class="status-text" id="statusText">Ready</span>
      <span class="status-text" id="sizeText"></span>
    </div>

    <script src="jspdf.min.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
