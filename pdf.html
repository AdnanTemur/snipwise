<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snipwise — Saving PDF…</title>
    <style>
      /* Fonts loaded via system stack */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #0a080f;
        color: #f5f3ff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid #2d2540;
        border-top-color: #a78bfa;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .msg {
        font-size: 14px;
        color: rgba(196, 181, 253, 0.7);
      }
      .done {
        color: #4ade80;
        font-size: 14px;
        display: none;
      }
      .err {
        color: #f87171;
        font-size: 13px;
        display: none;
        max-width: 300px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <div class="msg" id="msg">Generating PDF…</div>
    <div class="done" id="done">✓ PDF saved — you can close this tab</div>
    <div class="err" id="err"></div>
    <script src="jspdf.min.js"></script>
    <script src="pdf.js"></script>
  </body>
</html>
